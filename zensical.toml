[project]
site_name = "RustGIS 臺灣教學網"
site_description = "RustGIS 的繁體中文教學與臺灣範例資料"
site_author = "begin0808"
site_url = "https://begin0808.github.io/RustGIS-TW/"
repo_url = "https://github.com/begin0808/RustGIS-TW"
repo_name = "begin0808/RustGIS-TW"
copyright = "教學內容採用 CC BY 4.0 授權；範例資料依各提供機關的授權條款"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/external-links.js",
  "javascripts/lightbox.js",
  "javascripts/errata.js",
  "javascripts/glossary-filter.js",
  "javascripts/progress.js",
  "javascripts/back-to-top.js",
  "javascripts/visits.js",
]

nav = [
  { "首頁" = "index.md" },
  { "入門教學" = [
    "tutorials/index.md",
    "tutorials/01-open-web-app.md",
    "tutorials/02-load-boundaries.md",
    "tutorials/03-attribute-table.md",
    "tutorials/04-symbols-labels.md",
    "tutorials/05-buffer.md",
    "tutorials/06-export-map.md",
  ] },
  { "進階教學" = [
    "tutorials/advanced.md",
    "tutorials/07-choropleth.md",
    "tutorials/08-points.md",
    "tutorials/09-wmts.md",
    "tutorials/10-terrain.md",
    "tutorials/11-3d-terrain.md",
    "tutorials/12-time-slider.md",
    "tutorials/13-model-builder.md",
  ] },
  { "臺灣範例資料" = "data/index.md" },
  { "參考資料" = [
    "glossary.md",
    "faq.md",
  ] },
  { "關於本站" = "about.md" },
  { "RustGIS 網頁版" = "https://web.rustgis.app" },
  { "RustGIS 官方文件（英文）" = "https://rustgis.app" },
]

[project.theme]
language = "zh-TW"
custom_dir = "overrides"
favicon = "images/favicon.png"
logo = "images/favicon.png"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "切換為深色模式"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch"
toggle.name = "切換為淺色模式"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.keys]
